apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: 996860765311.dkr.ecr.us-east-2.amazonaws.com/taskflow-frontend:5ff6276
          ports:
            - containerPort: 80

          env:
            - name: VITE_API_URL
              value: "/api"