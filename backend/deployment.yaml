apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: 996860765311.dkr.ecr.us-east-2.amazonaws.com/taskflow-backend:5543e6e

          ports:
            - containerPort: 3000

          envFrom:
            - configMapRef:
                name: taskflow-config

            - secretRef:
                name: taskflow-secret

          readinessProbe:
            httpGet:
              path: api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20


